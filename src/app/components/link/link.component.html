<ng-template #content>
  <ng-content />
</ng-template>

@if (value()) {
  <a [href]="value()" target="_blank" rel="noopener noreferrer">
    @if (replacementText()) {
      <span>{{ replacementText() }}</span>
    } @else {
      <ng-container [ngTemplateOutlet]="content" />
    }
  </a>
} @else {
  <div>
    <ng-container [ngTemplateOutlet]="content" />
  </div>
}
